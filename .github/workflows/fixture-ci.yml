name: Fixture CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "fixtures/ci/**"

permissions:
  contents: read

jobs:
  fixture-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fixture
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic fixture failure
        run: python -m unittest discover -s fixtures/ci -p 'test_*.py' -v
